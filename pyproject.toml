[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-agent"
description = "Explore independent AI implementations, verify them, and select using measured evidence."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jason Raptis" }]
keywords = ["ai", "agents", "llm", "cli", "mcp"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "pydantic>=2",
    "openai>=3.23,<4",
]
dynamic = ["version"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=6", "ruff>=0.12", "build>=1"]

[project.urls]
Repository = "https://github.com/jayspyroyale/forge-agent"

# This line is what creates the `forge` command on your PATH.
# It means: "when someone runs `forge`, call the function `main` in module `forge.cli`".
[project.scripts]
forge = "forge.cli:main"

[tool.setuptools.dynamic]
version = { attr = "forge.__version__" }

[tool.setuptools.packages.find]
include = ["forge*"]

[tool.setuptools.package-data]
"forge.benchmarks" = ["tasks/*/benchmark.toml", "tasks/*/starter/*"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Live tests call real model servers. They never run by default; use `pytest -m live`.
addopts = "-m 'not live'"
markers = ["live: calls a real model provider (needs network, a server, or an API key)"]
