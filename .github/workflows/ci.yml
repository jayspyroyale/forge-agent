name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest --cov=forge --cov-report=term --cov-report=xml
      - run: python -m compileall -q forge tests
      - run: python -m ruff check forge tests
      - run: git diff --check
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.python }}
          path: coverage.xml
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build
      - run: python -m build
      - run: python -m venv /tmp/forge-install
      - run: /tmp/forge-install/bin/python -m pip install dist/*.whl
      - run: cd /tmp && /tmp/forge-install/bin/forge --help
      - run: cd /tmp && /tmp/forge-install/bin/python -m forge.benchmarks.demo
      - uses: actions/upload-artifact@v4
        with:
          name: distribution
          path: dist/*
